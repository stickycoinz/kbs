<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Turntable hero</title>
<style>
  body { margin: 0; background: #2a1810; }
  .turntable {
    position: relative;
    width: 100%;
    max-width: 1025px;
    aspect-ratio: 1025 / 821;
    margin: 0 auto;
    overflow: hidden;
  }
  .turntable img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Rotation centre of the white record in the 1025x821 source. */
  .turntable .spin {
    transform-origin: 48.29% 48.64%;
    animation: spin 1.8s linear infinite;
    will-change: transform;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .turntable .spin { animation: none; }
  }
</style>
</head>
<body>
  <div class="turntable" role="img" aria-label="Turntable playing a white record">
    <img src="01-base.png" alt="" />
    <img class="spin" src="02-vinyl.png" alt="" />
    <img src="03-tonearm.png" alt="" />
  </div>
</body>
</html>
